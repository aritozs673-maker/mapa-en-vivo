<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geocercas PRO</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

<link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body { margin:0; height:100%; }

#map {
  position:absolute;
  top:0;
  bottom:0;
  width:100%;
}

.controls{
 position:absolute;
 top:15px;
 left:15px;
 z-index:10;
 display:flex;
 flex-direction:column;
}

button{
 background:#7b1e3a;
 color:white;
 border:none;
 padding:10px;
 border-radius:10px;
 margin:5px;
}

#alertaBox{
 position:absolute;
 top:20px;
 right:20px;
 background:red;
 color:white;
 padding:15px;
 border-radius:10px;
 display:none;
 font-weight:bold;
 z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="alertaBox">🚨 FUERA DE LA ZONA</div>

<div class="controls">
  <button onclick="dibujar()">✏️ Dibujar</button>
  <button onclick="guardar()">💾 Guardar</button>
  <button onclick="limpiar()">🗑 Limpiar</button>
</div>

<script>

// 🔥 TOKEN
mapboxgl.accessToken = "pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA";

// 🔥 SUPABASE
const supabaseClient = window.supabase.createClient(
  "https://qlyndvihlqiirztnqxim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20"
);

// 🔔 PEDIR PERMISO NOTIFICACIÓN (NO ROMPE NADA)
if ("Notification" in window) {
  Notification.requestPermission();
}

// 🔥 MAPA
const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/streets-v12",
  center: [-68.2096, -16.5270],
  zoom: 15
});

let draw;

// =========================
// LOAD
// =========================
map.on("load", () => {

  draw = new MapboxDraw({
    displayControlsDefault: false
  });

  map.addControl(draw);

  // 📍 ubicación usuario
  const geo = new mapboxgl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true
  });

  map.addControl(geo);

  setTimeout(() => geo.trigger(), 1000);

  cargarGeocercas();
});

// =========================
// DIBUJAR
// =========================
function dibujar(){
  draw.changeMode("draw_polygon");
}

// =========================
// LIMPIAR
// =========================
async function limpiar(){

  draw.deleteAll();

  await supabaseClient
    .from("geocercas")
    .delete()
    .neq("id", 0);

  cargarGeocercas();
}

// =========================
// GUARDAR
// =========================
async function guardar(){

  const data = draw.getAll();

  if (!data.features.length){
    alert("Dibuja primero");
    return;
  }

  const coords = data.features[0].geometry.coordinates;

  await supabaseClient.from("geocercas").delete().neq("id",0);

  await supabaseClient
    .from("geocercas")
    .insert([{ nombre:"zona", coordenadas: coords }]);

  draw.deleteAll();
  cargarGeocercas();
}

// =========================
// CARGAR
// =========================
async function cargarGeocercas(){

  draw.deleteAll();

  const { data, error } = await supabaseClient
    .from("geocercas")
    .select("*");

  if(error){
    console.log(error);
    return;
  }

  data.forEach(g => {

    if (!g.coordenadas) return;

    draw.add({
      type:"Feature",
      geometry:{
        type:"Polygon",
        coordinates:g.coordenadas
      }
    });

  });
}

// =========================
// 🚨 REALTIME ALERTA (FIX)
// =========================
const channel = supabaseClient
.channel('alertas-tiempo-real')

.on('postgres_changes', {
  event:'INSERT',
  schema:'public',
  table:'alertas'
}, payload => {

  console.log("🚨 ALERTA:", payload);

  if(payload.new.mensaje === "FUERA"){

    // 🔴 ALERTA VISUAL
    const box = document.getElementById("alertaBox");
    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 5000);

    // 🔔 NOTIFICACIÓN REAL
    if (Notification.permission === "granted") {
      new Notification("🚨 ALERTA DE SEGURIDAD", {
        body: "El usuario salió de la geocerca",
        icon: "https://cdn-icons-png.flaticon.com/512/1828/1828843.png"
      });
    }

  }

})

.subscribe((status) => {
  console.log("REALTIME:", status);
});

</script>

</body>
</html>

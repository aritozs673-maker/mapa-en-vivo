async function limpiar(){

  draw.deleteAll();

  await supabaseClient
    .from("geocercas")
    .delete()
    .neq("id",0);

  cargarGeocercas();
}

// 🔥 VALIDAR PUNTO EN POLÍGONO
function dentroPoligono(punto, poligono){

  let x = punto[0];
  let y = punto[1];

  let inside = false;

  for(let i=0, j=poligono.length-1; i<poligono.length; j=i++){

    let xi = poligono[i][0];
    let yi = poligono[i][1];

    let xj = poligono[j][0];
    let yj = poligono[j][1];

    let intersect =
      ((yi > y) != (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);

    if(intersect) inside = !inside;
  }

  return inside;
}

async function guardar(){

  const data = draw.getAll();

  if(!data.features.length){
    alert("Dibuja primero");
    return;
  }

  const coords = data.features[0].geometry.coordinates;

  await supabaseClient
    .from("geocercas")
    .delete()
    .neq("id",0);

  await supabaseClient
    .from("geocercas")
    .insert([{
      nombre:"zona",
      coordenadas: coords
    }]);

  validarGeocerca();

  draw.deleteAll();

  cargarGeocercas();
}

async function cargarGeocercas(){

  draw.deleteAll();

  const { data } = await supabaseClient
    .from("geocercas")
    .select("*");

  data.forEach(g => {

    draw.add({
      type:"Feature",
      geometry:{
        type:"Polygon",
        coordinates:g.coordenadas
      }
    });

  });
}

// 🔥 CARGAR ÚLTIMA UBICACIÓN
async function cargarUltimaUbicacion(){

  const { data } = await supabaseClient
    .from("ubicaciones")
    .select("*")
    .order("id", { ascending:false })
    .limit(1);

  if(!data.length) return;

  const ultima = data[0];

  userLocation = [ultima.lng, ultima.lat];

  mostrarMarcador();

  validarGeocerca();
}

// 🔥 MOSTRAR MARCADOR

  if(!marcadorUsuario){

    marcadorUsuario = new mapboxgl.Marker({
      color:"blue"
    })
    .setLngLat(userLocation)
    .addTo(map);

  }else{

    marcadorUsuario.setLngLat(userLocation);

  }

  map.flyTo({
    center:userLocation,
    zoom:16
  });
}

// 🔥 VALIDAR GEOCERCA
async function validarGeocerca(){

  if(!userLocation) return;

  const { data } = await supabaseClient
    .from("geocercas")
    .select("*");

  if(!data.length) return;

  const coords = data[0].coordenadas[0];

  const dentro = dentroPoligono(userLocation, coords);

  const box = document.getElementById("alertaBox");

  if(dentro){

// 🔥 REALTIME UBICACIONES
supabaseClient
.channel("ubicaciones")

.on("postgres_changes", {
  event:"INSERT",
  schema:"public",
  table:"ubicaciones"
}, payload => {

  const nueva = payload.new;

  userLocation = [nueva.lng, nueva.lat];

  mostrarMarcador();

  validarGeocerca();

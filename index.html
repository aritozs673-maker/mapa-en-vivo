<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Geocercas App</title>

<!-- MAPBOX -->
<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

<!-- DRAW -->
<link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
}

/* MAPA */
#map{
  position:absolute;
  width:100%;
  height:100%;
}

/* PANEL */
.controls{
  position:absolute;
  top:20px;
  left:20px;
  z-index:10;

  display:flex;
  flex-direction:column;
  gap:12px;
}

/* BOTONES */
button{
  background:#7b1e3a;
  color:white;
  border:none;
  padding:14px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;

  box-shadow:0 4px 10px rgba(0,0,0,.25);

  transition:0.2s;
}

button:hover{
  background:#5c132b;
  transform:scale(1.03);
}

/* BI USUARIO */
.user-marker{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#00bfff;
  border:4px solid white;
  box-shadow:0 0 10px rgba(0,0,0,.4);
}

</style>
</head>

<body>

<div id="map"></div>

<div class="controls">

  <button onclick="activarDibujo()">
    ✏️ Dibujar Geocerca
  </button>

  <button onclick="guardarGeocerca()">
    💾 Guardar Geocerca
  </button>

  <button onclick="eliminarTodo()">
    🗑️ Borrar
  </button>

</div>

<script>

// ======================================================
// TOKEN MAPBOX
// ======================================================

mapboxgl.accessToken =
"pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA";

// ======================================================
// SUPABASE
// ======================================================

const supabase = window.supabase.createClient(
  "https://qlyndvihlqiirztnqxim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20"
);

// ======================================================
// MAPA
// ======================================================

const map = new mapboxgl.Map({
  container:'map',
  style:'mapbox://styles/mapbox/streets-v12',

  center:[-68.1193,-16.4897], // LA PAZ

  zoom:14
});

// ======================================================
// CONTROLES MAPA
// ======================================================

map.addControl(new mapboxgl.NavigationControl());

// ======================================================
// DRAW
// ======================================================

const draw = new MapboxDraw({

  displayControlsDefault:false,

  controls:{
    polygon:true,
    trash:true
  },

  styles:[

    // FILL
    {
      'id':'gl-draw-polygon-fill',
      'type':'fill',
      'filter':['all',['==','$type','Polygon']],
      'paint':{
        'fill-color':'#7b1e3a',
        'fill-opacity':0.35
      }
    },

    // LINE
    {
      'id':'gl-draw-polygon-stroke-active',
      'type':'line',
      'filter':['all',['==','$type','Polygon']],
      'layout':{
        'line-cap':'round',
        'line-join':'round'
      },
      'paint':{
        'line-color':'#7b1e3a',
        'line-width':3
      }
    }

  ]

});

map.addControl(draw);

// ======================================================
// CARGA INICIAL
// ======================================================

map.on('load', async()=>{

  await cargarGeocercas();

  iniciarGPS();

});

// ======================================================
// DIBUJAR
// ======================================================

function activarDibujo(){

  draw.changeMode('draw_polygon');

}

// ======================================================
// BORRAR
// ======================================================

async function eliminarTodo(){

  draw.deleteAll();

  if(map.getSource('geocercas')){
    map.getSource('geocercas').setData({
      type:'FeatureCollection',
      features:[]
    });
  }

  await supabase
    .from('geocercas')
    .delete()
    .neq('id',0);

  alert("Geocercas eliminadas");

}

// ======================================================
// GUARDAR
// ======================================================

async function guardarGeocerca(){

  const data = draw.getAll();

  if(!data.features.length){

    alert("Dibuja una geocerca primero");
    return;
  }

  const coords =
    data.features[0].geometry.coordinates;

  // BORRAR ANTERIORES
  await supabase
    .from('geocercas')
    .delete()
    .neq('id',0);

  // INSERTAR NUEVA
  const {error} = await supabase
    .from('geocercas')
    .insert([{

      nombre:'zona',

      coordenadas:coords

    }]);

  if(error){

    console.log(error);

    alert("Error guardando");
    return;
  }

  alert("✅ Geocerca guardada");

  draw.deleteAll();

  cargarGeocercas();

}

// ======================================================
// CARGAR GEOCERCAS
// ======================================================

async function cargarGeocercas(){

  const {data,error} = await supabase
    .from('geocercas')
    .select('*');

  if(error){

    console.log(error);
    return;
  }

  const features = data.map(g=>({

    type:'Feature',

    geometry:{
      type:'Polygon',
      coordinates:g.coordenadas
    },

    properties:{
      nombre:g.nombre
    }

  }));

  const geojson = {

    type:'FeatureCollection',

    features:features

  };

  // SI YA EXISTE
  if(map.getSource('geocercas')){

    map.getSource('geocercas')
      .setData(geojson);

    return;
  }

  // SOURCE
  map.addSource('geocercas',{

    type:'geojson',

    data:geojson

  });

  // FILL
  map.addLayer({

    id:'geocercas-fill',

    type:'fill',

    source:'geocercas',

    paint:{

      'fill-color':'#7b1e3a',

      'fill-opacity':0.35

    }

  });

  // BORDER
  map.addLayer({

    id:'geocercas-border',

    type:'line',

    source:'geocercas',

    paint:{

      'line-color':'#7b1e3a',

      'line-width':3

    }

  });

}

// ======================================================
// GPS USUARIO
// ======================================================

let markerUsuario = null;

function iniciarGPS(){

  if(!navigator.geolocation){

    alert("Tu navegador no soporta GPS");
    return;
  }
  navigator.geolocation.watchPosition(
    (position)=>{
      const lng = position.coords.longitude;
      const lat = position.coords.latitude;

      // CREAR BI
      if(!markerUsuario){
        const el = document.createElement('div');
        el.className = 'user-marker';
        markerUsuario = new mapboxgl.Marker(el)
          .setLngLat([lng,lat])
          .addTo(map);
        // CENTRAR
        map.flyTo({

          center:[lng,lat],

          zoom:16
        });
      }else{
        markerUsuario.setLngLat([lng,lat]);
      }
    },
    (error)=>{
      console.log(error);
      alert("No se pudo obtener ubicación");
    },
    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:5000
    }
  );
}
</script>
</bo
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geocercas PRO</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

<link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body { margin:0; height:100%; }

#map { position:absolute; top:0; bottom:0; width:100%; }

.controls{
 position:absolute;
 top:15px;
 left:15px;
 z-index:10;
 display:flex;
 flex-direction:column;
}

button{
 background:#7b1e3a;
 color:white;
 border:none;
 padding:10px;
 border-radius:10px;
 margin:5px;
 cursor:pointer;
}

#alertaBox{
 position:absolute;
 top:20px;
 right:20px;
 background:red;
 color:white;
 padding:15px;
 border-radius:10px;
 display:none;
 font-weight:bold;
 z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="alertaBox">🚨 ALERTA</div>

<div class="controls">
  <button onclick="dibujar()">✏️ Dibujar</button>
  <button onclick="guardar()">💾 Guardar</button>
  <button onclick="limpiar()">🗑 Limpiar</button>
</div>

<script>

mapboxgl.accessToken = "pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA";

const supabaseClient = window.supabase.createClient(
  "https://qlyndvihlqiirztnqxim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20"
);

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/streets-v12",
  center: [-68.2096, -16.5270],
  zoom: 15
});

let draw;
let userLocation = null;

map.on("load", () => {

  draw = new MapboxDraw({ displayControlsDefault: false });
  map.addControl(draw);

  const geo = new mapboxgl.GeolocateControl({
    trackUserLocation: true,
    showUserHeading: true
  });

  geo.on("geolocate", e => {
    userLocation = [e.coords.longitude, e.coords.latitude];
  });

  map.addControl(geo);
  setTimeout(() => geo.trigger(), 1000);

  cargarGeocercas();
});

function dibujar(){
  draw.changeMode("draw_polygon");
}

async function limpiar(){
  draw.deleteAll();

  await supabaseClient.from("geocercas").delete().neq("id",0);
  await supabaseClient.from("alertas").insert([{ mensaje:"ACTUALIZADA" }]);

  cargarGeocercas();
}

// 🔥 FUNCIÓN PARA SABER SI ESTÁ DENTRO
function dentroPoligono(punto, poligono){

  let x = punto[0], y = punto[1];
  let inside = false;

  for (let i=0, j=poligono.length-1; i<poligono.length; j=i++) {

    let xi = poligono[i][0], yi = poligono[i][1];
    let xj = poligono[j][0], yj = poligono[j][1];

    let intersect =
      ((yi > y) != (yj > y)) &&
      (x < (xj-xi)*(y-yi)/(yj-yi)+xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

async function guardar(){

  const data = draw.getAll();

  if (!data.features.length){
    alert("Dibuja primero");
    return;
  }

  const coords = data.features[0].geometry.coordinates;

  await supabaseClient.from("geocercas").delete().neq("id",0);

  await supabaseClient
    .from("geocercas")
    .insert([{ nombre:"zona", coordenadas: coords }]);

  // 🔥 VALIDAR SI ESTÁ FUERA
  if(userLocation){

    const dentro = dentroPoligono(userLocation, coords[0]);

    if(!dentro){
      await supabaseClient.from("alertas")
        .insert([{ mensaje:"FUERA" }]);
    }else{
      await supabaseClient.from("alertas")
        .insert([{ mensaje:"DENTRO" }]);
    }
  }

  draw.deleteAll();
  cargarGeocercas();
}

async function cargarGeocercas(){

  draw.deleteAll();

  const { data } = await supabaseClient.from("geocercas").select("*");

  data.forEach(g => {

    draw.add({
      type:"Feature",
      geometry:{
        type:"Polygon",
        coordinates:g.coordenadas
      }
    });

  });
}

// 🚨 REALTIME
supabaseClient
.channel("alertas")
.on("postgres_changes", {
  event:"INSERT",
  schema:"public",
  table:"alertas"
}, payload => {

  const msg = payload.new.mensaje;

  const box = document.getElementById("alertaBox");

  if(msg === "FUERA"){
    box.innerText = "🚨 FUERA DE LA ZONA";
  }else{
    box.innerText = "✅ DENTRO DE LA ZONA";
  }

  box.style.display = "block";

  setTimeout(() => {
    box.style.display = "none";
  }, 4000);

})
.subscribe();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geocercas PRO</title>

<!-- MAPBOX -->
<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

<!-- DRAW -->
<link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>

<!-- SUPABASE (SOLO UNA VEZ) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body { margin:0; height:100%; }

#map {
  position:absolute;
  top:0;
  bottom:0;
  width:100%;
}

/* BOTONES */
.controls{
 position:absolute;
 top:15px;
 left:15px;
 z-index:10;
 display:flex;
 flex-direction:column;
}

button{
 background:#7b1e3a;
 color:white;
 border:none;
 padding:12px 16px;
 border-radius:12px;
 font-weight:bold;
 cursor:pointer;
 margin:5px;
 box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

button:hover{
 background:#a63a5a;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="controls">
  <button onclick="dibujar()">✏️ Dibujar</button>
  <button onclick="guardar()">💾 Guardar</button>
  <button onclick="limpiar()">🗑 Limpiar</button>
</div>

<script>

// 🔥 TOKEN MAPBOX
mapboxgl.accessToken = "pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA" // ← SI FALLA EL MAPA ES POR ESTO

// 🔥 SUPABASE (UNA SOLA VEZ)
const supabase = window.supabase.createClient(
  "https://qlyndvihlqiirztnqxim.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20"
);

// 🔥 MAPA
const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/streets-v12",
  center: [-68.2096, -16.5270],
  zoom: 15
});

let draw;

// 🔥 CUANDO CARGA
map.on("load", () => {

  draw = new MapboxDraw({
    displayControlsDefault: false,
    styles: [
      {
        id: "polygon-fill",
        type: "fill",
        paint: {
          "fill-color": "#7b1e3a",
          "fill-opacity": 0.4
        }
      },
      {
        id: "polygon-line",
        type: "line",
        paint: {
          "line-color": "#7b1e3a",
          "line-width": 3
        }
      }
    ]
  });

  map.addControl(draw);

  cargarGeocercas();
});

// 🔥 ACTIVAR DIBUJO
function dibujar(){
  draw.changeMode("draw_polygon");
}

// 🔥 LIMPIAR
function limpiar(){
  draw.deleteAll();
}

// 🔥 GUARDAR
async function guardar(){

  const data = draw.getAll();

  if (!data.features.length){
    alert("Dibuja primero");
    return;
  }

  const coords = data.features[0].geometry.coordinates;

  const { error } = await supabase
    .from("geocercas")
    .insert([
      {
        nombre: "zona",
        coordenadas: coords
      }
    ]);

  if (error){
    console.log(error);
    alert("❌ Error");
  } else {
    alert("✅ Guardado");
    draw.deleteAll();
    cargarGeocercas();
  }
}

// 🔥 CARGAR DESDE BD
async function cargarGeocercas(){

  const { data, error } = await supabase
    .from("geocercas")
    .select("*");

  if (error){
    console.log(error);
    return;
  }

  data.forEach(g => {

    if (!g.coordenadas) return;

    draw.add({
      type: "Feature",
      geometry: {
        type: "Polygon",
        coordinates: g.coordenadas
      }
    });

  });
}

</script>

</body>
</html>

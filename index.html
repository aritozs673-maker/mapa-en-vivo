<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa Geocercas</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
}

#map {
  width: 100%;
  height: 100vh; /* 🔥 CLAVE */
}

button {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1;
  padding: 10px;
}
</style>
</head>

<body>

<button onclick="guardarGeocerca()">Guardar Geocerca</button>
<div id="map"></div>

<script>

window.onload = function () {

  // 🔥 PON TU TOKEN REAL
  mapboxgl.accessToken = "pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA";

  const map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/streets-v12",
    center: [-68.2096, -16.5270],
    zoom: 17
  });

  // 🔥 DIBUJAR
  const draw = new MapboxDraw({
    displayControlsDefault: false,
    controls: { polygon: true, trash: true }
  });

  map.addControl(draw);

  // 🔥 SUPABASE
  const supabase = window.supabase.createClient(
    "https://qlyndvihlqiirztnqxim.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20"
  );

  // 🔥 GUARDAR GEOCERCA
  window.guardarGeocerca = async function () {

    const data = draw.getAll();

    if (data.features.length === 0) {
      alert("Dibuja una geocerca primero");
      return;
    }

    const coords = data.features[0].geometry.coordinates;

    const { error } = await supabase
      .from("geocercas")
      .insert([
        { nombre: "zona1", coordenadas: coords }
      ]);

    if (error) {
      console.log(error);
      alert("Error guardando");
    } else {
      alert("Geocerca guardada");
    }
  }

}

</script>

</body>
</html>

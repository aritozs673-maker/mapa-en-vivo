<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geocercas</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body,html{margin:0;height:100%}
#map{width:100%;height:100%}
button{
 position:absolute;
 top:10px;
 left:10px;
 z-index:1;
 padding:10px;
}
</style>
</head>

<body>

<button onclick="activarDibujo()">Dibujar Geocerca</button>
<button onclick="guardarGeocerca()">Guardar</button>

<div id="map"></div>

<script>

mapboxgl.accessToken = "pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA";

const supabase = window.supabase.createClient(
 "https://qlyndvihlqiirztnqxim.supabase.co",
 "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20"
);

const map = new mapboxgl.Map({
 container:'map',
 style:'mapbox://styles/mapbox/streets-v12',
 center:[-68.2096,-16.5270],
 zoom:17
});

let puntos = [];
let polygon = null;

// 🔥 TRAER UBICACIÓN DEL CELULAR
async function actualizarUbicacion(){
 const {data} = await supabase
  .from("ubicaciones")
  .select("*")
  .order("id",{ascending:false})
  .limit(1);

 if(data.length>0){
   const lat = data[0].lat;
   const lon = data[0].lon;

   new mapboxgl.Marker()
    .setLngLat([lon,lat])
    .addTo(map);

   map.setCenter([lon,lat]);
 }
}

setInterval(actualizarUbicacion,2000);

// 🔥 DIBUJAR CON CLICKS
function activarDibujo(){
 puntos = [];

 map.on('click', function(e){
   puntos.push([e.lngLat.lng, e.lngLat.lat]);

   if(puntos.length>2){
     if(polygon) polygon.remove();

     polygon = new mapboxgl.Polygon({
       coordinates:[puntos]
     });
   }
 });
}

// 🔥 GUARDAR EN SUPABASE
async function guardarGeocerca(){

 const {error} = await supabase
  .from("geocercas")
  .insert([{coords:puntos}]);

 if(error){
   alert("ERROR");
 }else{
   alert("GUARDADO");
 }
}

</script>

</body>
</html>

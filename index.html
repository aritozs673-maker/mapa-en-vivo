<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mapa en tiempo real</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />

<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
}

#map {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 100%;
}

.controls {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 10;
}

button {
  padding: 12px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  background: #007bff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="controls">
  <button onclick="guardarUbicacion()">📍 Guardar ubicación</button>
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// 🔥 1. PON TU TOKEN REAL AQUÍ (OBLIGATORIO)
mapboxgl.accessToken = "pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA";

// 🔥 2. SUPABASE
const supabaseUrl = "https://qlyndvihlqiirztnqxim.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// 🔥 3. CREAR MAPA
const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/streets-v12",
  center: [-68.2096, -16.5270],
  zoom: 15
});

// 🔥 4. MARCADOR
let marker = new mapboxgl.Marker().addTo(map);

// 🔥 5. UBICACIÓN EN TIEMPO REAL
navigator.geolocation.watchPosition(

  (pos) => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    marker.setLngLat([lon, lat]);
    map.setCenter([lon, lat]);

    console.log("📍 Ubicación:", lat, lon);
  },

  (error) => {
    console.log("❌ ERROR GPS:", error);
    alert("⚠️ Activa la ubicación y permite el GPS");
  },

  {
    enableHighAccuracy: true
  }
);

// 🔥 6. GUARDAR EN SUPABASE
async function guardarUbicacion() {

  navigator.geolocation.getCurrentPosition(async (pos) => {

    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    const { error } = await supabase
      .from("ubicaciones")
      .insert([
        { lat: lat, lon: lon }
      ]);

    if (error) {
      console.log("❌ ERROR:", error);
      alert("Error guardando en Supabase");
    } else {
      alert("✅ Ubicación guardada");
    }

  });

}

</script>

</body>
</html>

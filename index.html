<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Geocercas PRO</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>

<link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.2/mapbox-gl-draw.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
html, body{ margin:0; height:100%; }
#map{ position:absolute; top:0; bottom:0; width:100%; }

.controls{
  position:absolute;
  top:15px;
  left:15px;
  z-index:10;
  display:flex;
  flex-direction:column;
}

button{
  background:#7b1e3a;
  color:white;
  border:none;
  padding:10px;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}

#alertaBox{
  position:absolute;
  top:20px;
  right:20px;
  background:red;
  color:white;
  padding:15px;
  border-radius:10px;
  display:none;
  font-weight:bold;
  z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>
<div id="alertaBox">🚨 ALERTA</div>

<div class="controls">
  <button onclick="dibujar()">✏️ Dibujar</button>
  <button onclick="guardar()">💾 Guardar</button>
  <button onclick="limpiar()">🗑 Limpiar</button>
</div>

<script>

// =====================
// 🔑 KEYS
// =====================
mapboxgl.accessToken = "pk.eyJ1IjoiYXJpMjAzMjU5MCIsImEiOiJjbW01bWVxMnQwOGY0MnFvbTkxenYyejJvIn0.3ew4xglzFTB6e8p-B6QoRA";

const supabaseClient = supabase.createClient(
"https://qlyndvihlqiirztnqxim.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFseW5kdmlobHFpaXJ6dG5xeGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0OTc0OTUsImV4cCI6MjA4ODA3MzQ5NX0.t06Jz01XxqgSiOTnCNBi4_b79o_jz8cfi8-BfTQM_20"
);

// =====================
// MAPA
// =====================
const map = new mapboxgl.Map({
  container:"map",
  style:"mapbox://styles/mapbox/streets-v12",
  center:[-68.2096, -16.5270],
  zoom:15
});

let draw;
let marker = null;
let userLocation = null;
let estadoAnterior = null;

// =====================
map.on("load", () => {
  draw = new MapboxDraw({ displayControlsDefault:false });
  map.addControl(draw);
  cargarGeocerca();
});

// =====================
function dibujar(){
  draw.changeMode("draw_polygon");
}

// =====================
function dibujarGeocerca(coords){

  removerCapa();

  map.addSource("geo", {
    type:"geojson",
    data:{
      type:"Feature",
      geometry:{ type:"Polygon", coordinates: coords }
    }
  });

  map.addLayer({
    id:"geo-fill",
    type:"fill",
    source:"geo",
    paint:{ "fill-color":"red", "fill-opacity":0.4 }
  });

  map.addLayer({
    id:"geo-line",
    type:"line",
    source:"geo",
    paint:{ "line-color":"red", "line-width":3 }
  });
}

// =====================
async function guardar(){

  const data = draw.getAll();

  if(!data.features.length){
    alert("Dibuja primero");
    return;
  }

  const coords = data.features[0].geometry.coordinates;

  // 🔥 dibuja instantáneo
  dibujarGeocerca(coords);

  await supabaseClient.from("geocercas").delete().neq("id",0);

  await supabaseClient.from("geocercas")
    .insert([{ nombre:"zona", coordenadas:coords }]);

  // 🔥 NOTIFICAR APP
  await supabaseClient.from("alertas")
    .insert([{ mensaje:"ACTUALIZADA" }]);

  draw.deleteAll();
}

// =====================
async function limpiar(){

  draw.deleteAll();

  await supabaseClient.from("geocercas").delete().neq("id",0);

  removerCapa();

  // 🔥 NOTIFICAR APP
  await supabaseClient.from("alertas")
    .insert([{ mensaje:"LIMPIADA" }]);
}

// =====================
async function cargarGeocerca(){

  const { data } = await supabaseClient
    .from("geocercas")
    .select("*");

  if(!data || !data.length) return;

  dibujarGeocerca(data[0].coordenadas);
}

// =====================
function removerCapa(){
  if(map.getLayer("geo-fill")) map.removeLayer("geo-fill");
  if(map.getLayer("geo-line")) map.removeLayer("geo-line");
  if(map.getSource("geo")) map.removeSource("geo");
}

// =====================
function dentroPoligono(punto, poligono){

  let x = punto[0], y = punto[1];
  let inside = false;

  for(let i=0, j=poligono.length-1; i<poligono.length; j=i++){

    let xi = poligono[i][0], yi = poligono[i][1];
    let xj = poligono[j][0], yj = poligono[j][1];

    let intersect =
      ((yi > y) != (yj > y)) &&
      (x < (xj - xi)*(y - yi)/(yj - yi) + xi);

    if(intersect) inside = !inside;
  }

  return inside;
}

// =====================
// 🔥 UBICACION EN TIEMPO REAL
// =====================
supabaseClient
.channel("ubicaciones")
.on("postgres_changes", {
  event:"INSERT",
  schema:"public",
  table:"ubicaciones"
}, async payload => {

  const lat = parseFloat(payload.new.lat);
  const lon = parseFloat(payload.new.lon);

  if(!isFinite(lat) || !isFinite(lon)) return;

  console.log("UBICACION:", lat, lon);

  userLocation = [lon, lat];

  if(!marker){
    marker = new mapboxgl.Marker({color:"blue"})
      .setLngLat(userLocation)
      .addTo(map);
  } else {
    marker.setLngLat(userLocation);
  }

  map.flyTo({ center:userLocation, zoom:16 });

  const { data } = await supabaseClient
    .from("geocercas")
    .select("*");

  if(!data.length) return;

  const coords = data[0].coordenadas[0];

  const dentro = dentroPoligono(userLocation, coords);

  console.log("DENTRO:", dentro);

  // 🔥 SIEMPRE ALERTA SI ESTÁ FUERA
  if(!dentro){

    mostrarAlerta("🚨 FUERA DE LA ZONA");

    if(estadoAnterior !== false){
      await supabaseClient.from("alertas")
        .insert([{ mensaje:"FUERA" }]);
    }
  }

  // 🔥 OPCIONAL: cuando vuelve dentro
  if(dentro && estadoAnterior === false){
    mostrarAlerta("✅ DENTRO DE LA ZONA");
  }

  estadoAnterior = dentro;

})
.subscribe();

// =====================
function mostrarAlerta(msg){

  const box = document.getElementById("alertaBox");

  box.innerText = msg;
  box.style.display = "block";

  setTimeout(()=> box.style.display="none", 4000);
}

</script>
</body>
</html>
